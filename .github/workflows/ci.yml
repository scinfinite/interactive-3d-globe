name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "Checking project structure..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f main.js || (echo "Missing main.js" && exit 1)
          test -f styles.css || (echo "Missing styles.css" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          echo "All required files present."

      - name: Validate HTML structure
        run: |
          echo "Basic HTML sanity checks..."
          grep -q '<canvas id="globe-canvas">' index.html || (echo "Canvas missing" && exit 1)
          grep -q 'type="module" src="main.js"' index.html || (echo "main.js script missing" && exit 1)
          grep -q 'location-list' index.html || (echo "Location list missing" && exit 1)
          echo "HTML structure looks good."

      - name: Validate JS modules
        run: |
          echo "Checking main.js for key features..."
          grep -q 'OrbitControls' main.js || (echo "OrbitControls missing" && exit 1)
          grep -q 'autoRotate' main.js || (echo "autoRotate missing" && exit 1)
          grep -q 'LOCATIONS' main.js || (echo "LOCATIONS data missing" && exit 1)
          grep -q 'focusOnLocation' main.js || (echo "focusOnLocation missing" && exit 1)
          grep -q 'Atmosphere' main.js || grep -q 'atmosphere' main.js || (echo "Atmosphere missing" && exit 1)
          echo "JS features present."

      - name: Success
        run: echo "✅ CI checks passed"
