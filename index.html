<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D Globe</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <canvas id="globe-canvas"></canvas>

    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Featured Locations</h1>
        <p class="subtitle">Click a place to focus the camera</p>
      </header>
      <ul id="location-list" class="location-list"></ul>
      <footer class="sidebar-footer">
        <p>Drag to spin · Scroll to zoom</p>
        <p class="hint">Auto-rotate pauses while you interact</p>
      </footer>
    </aside>

    <div id="tooltip" class="tooltip" hidden></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
