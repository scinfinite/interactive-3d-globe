<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <title>Interactive 3D Globe</title>
  </head>
  <body>
    <div id="app">
      <canvas id="globe"></canvas>
      <aside class="locations-panel" aria-label="Featured locations">
        <div class="eyebrow">EXPLORE THE WORLD</div>
        <h1>Featured locations</h1>
        <p class="intro">Drag to spin the globe. Select a marker to focus the camera.</p>
        <div id="locations" class="location-list"></div>
      </aside>
      <div class="hint" aria-live="polite">
        <span class="hint-dot"></span>
        <span id="status">Auto-rotate enabled</span>
      </div>
      <div id="tooltip" class="tooltip" aria-hidden="true"></div>
      <div class="attribution">Interactive globe · Three.js</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
